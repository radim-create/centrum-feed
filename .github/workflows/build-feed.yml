name: Build Centrum feed

on:
  schedule:
    # Zaloha; hlavni spousteni resi Cloudflare Worker msn-feed-trigger.
    # 10. minuta = 5 minut za msn-feed buildem (:05), aby byl zdrojovy feed
    # uz nasazeny na GitHub Pages. Minuta je stejna v UTC i v CET/CEST.
    - cron: "10 * * * *"
  workflow_dispatch: {}     # rucni spusteni z UI

permissions:
  contents: write

concurrency:
  group: build-centrum-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate feed
        env:
          SOURCE_URL: https://radim-create.github.io/msn-feed/feed.xml
          SELF_URL: https://radim-create.github.io/centrum-feed/feed.xml
        run: python transform.py

      - name: Commit & push if changed
        run: |
          git config user.name "centrum-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/feed.xml
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update Centrum feed"
            git push
          fi
